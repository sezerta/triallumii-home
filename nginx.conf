server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;
  charset_types text/html text/plain text/css application/javascript;
  gzip on; gzip_types text/html text/css application/javascript image/svg+xml;
  location /assets/ { add_header Cache-Control "public, max-age=86400"; }
  location = /health { default_type text/plain; return 200 "ok\n"; }
  location / { add_header Cache-Control "public, max-age=300"; try_files $uri /index.html; }
}
