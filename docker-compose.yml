services:
  web:
    build: { context: ., dockerfile: web/Dockerfile }
    environment:
      DASH_USER: ${DASH_USER}
      DASH_PASS: ${DASH_PASS}
    depends_on: [ agent ]
    expose: [ "80" ]
    restart: unless-stopped
  agent:
    build: { context: ., dockerfile: agent/Dockerfile }
    environment:
      HOST_NAME: netcup-vps
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /:/host/root:ro
    expose: [ "8080" ]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256m } } }
