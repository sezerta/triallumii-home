<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Giriş — Lumii sunucu paneli</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Cpath d='M12 40l12-14 10 10 8-18 10 22' fill='none' stroke='%2334d399' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  /* Renk değişkenleri durum.html ile aynı. Dış kaynak yok: font sistem yığınından. */
  :root{--bg:#0b1020;--card:#121a2e;--card2:#172038;--line:#223052;--fg:#e8edf7;--muted:#96a3c0;--dim:#5f6d8c;
        --accent:#7dd3fc;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--radius:16px}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);
       font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
       line-height:1.45;font-size:14px;display:grid;place-items:center;padding:24px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,"JetBrains Mono",monospace}
  .bg{position:fixed;inset:0;z-index:-1;background:
      radial-gradient(900px 500px at 15% -10%, rgba(125,211,252,.16), transparent 60%),
      radial-gradient(700px 400px at 90% 10%, rgba(52,211,153,.10), transparent 60%), var(--bg)}
  .card{width:100%;max-width:380px;background:linear-gradient(180deg,var(--card2),var(--card));
        border:1px solid var(--line);border-radius:var(--radius);padding:26px 24px 22px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;margin-bottom:4px}
  .brand .mark{width:32px;height:32px;border-radius:9px;background:#0f172a;border:1px solid var(--line);display:grid;place-items:center;flex:none}
  .brand small{display:block;font-weight:500;font-size:11px;color:var(--dim);letter-spacing:.04em}
  .lead{color:var(--muted);font-size:12.5px;margin:0 0 18px}
  label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:0 0 6px}
  .f{width:100%;border:1px solid var(--line);background:#0a0f1c;color:var(--fg);padding:10px 12px;
     border-radius:10px;font:inherit;font-size:14px}
  .f:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(125,211,252,.14)}
  .row{margin-bottom:14px}
  #code{letter-spacing:.34em;text-align:center;font-size:19px;font-weight:700;
        font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .btn{width:100%;margin-top:4px;border:1px solid var(--line);background:var(--fg);color:var(--bg);
       padding:11px 12px;border-radius:10px;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer}
  .btn:hover:not(:disabled){background:#fff}
  .btn:disabled{opacity:.5;cursor:progress}
  .msg{min-height:17px;margin:12px 0 0;font-size:12.5px;color:var(--bad);font-weight:600}
  .msg[data-s="ok"]{color:var(--ok)}
  .hint{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);color:var(--dim);font-size:11.5px;display:flex;justify-content:space-between;gap:10px}
  .hint a{color:var(--muted);text-decoration:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div>
<main class="card">
  <div class="brand">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 64 64" width="18" height="18" fill="none"><path d="M12 40l12-14 10 10 8-18 10 22" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span>Sunucu paneli<small class="mono">şifre + 2FA</small></span>
  </div>
  <p class="lead">Oturum 12 saat. 5 hatalı denemede 15 dk kilit.</p>

  <form id="form" autocomplete="on">
    <div class="row">
      <label for="user">Kullanıcı</label>
      <input class="f" id="user" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    </div>
    <div class="row">
      <label for="pass">Şifre</label>
      <input class="f" id="pass" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="row">
      <label for="code">Doğrulama kodu</label>
      <input class="f" id="code" name="otp" inputmode="numeric" autocomplete="one-time-code"
             pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
    </div>
    <button class="btn" id="go" type="submit">Gir</button>
  </form>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <div class="hint"><span>Google Authenticator · 30 sn</span><a href="/">← vitrin</a></div>
</main>

<script>
const $ = id => document.getElementById(id);
const form = $("form"), msg = $("msg"), go = $("go");

$("code").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6);
});

function say(text, state){ msg.textContent = text; msg.dataset.s = state || "bad"; }

form.addEventListener("submit", async e => {
  e.preventDefault();
  go.disabled = true; say("", "ok"); msg.textContent = "kontrol ediliyor…"; msg.dataset.s = "ok";
  try {
    const r = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      cache: "no-store",
      body: JSON.stringify({ user: $("user").value.trim(), pass: $("pass").value, code: $("code").value })
    });
    if (r.ok) { say("giriş başarılı", "ok"); location.replace("/durum"); return; }
    let err = "giriş başarısız (HTTP " + r.status + ")";
    try { const j = await r.json(); if (j && j.error) err = j.error; } catch {}
    if (r.status === 429 && err.indexOf("HTTP") === 0) err = "çok fazla deneme — biraz bekleyin";
    say(err);
  } catch {
    say("sunucuya ulaşılamadı");
  }
  $("code").value = ""; $("code").focus();
  go.disabled = false;
});

$("user").focus();
</script>
</body>
</html>
