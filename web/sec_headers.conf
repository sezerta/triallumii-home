# Güvenlik başlıkları. add_header'lı her location'da tekrar include edilmeli —
# nginx'te alt bağlamda bir add_header varsa üst bağlamdakiler devralınmaz.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# style/font: mevcut sayfalar Google Fonts kullanıyor. connect-src: vitrindeki canlılık kontrolü
# *.triallumii.online'a no-cors istek atıyor. Bu iki izin olmadan mevcut sayfalar kırılır.
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.triallumii.online; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
