server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;
  charset_types text/html text/plain text/css application/javascript application/json;
  gzip on; gzip_types text/html text/css application/javascript application/json image/svg+xml;
  location /assets/ { add_header Cache-Control "public, max-age=86400"; }
  location = /health { default_type text/plain; return 200 "ok\n"; }
  location = /durum  { include /etc/nginx/dash_auth.conf; default_type text/html; add_header Cache-Control "no-store"; alias /usr/share/nginx/html/durum.html; }
  location = /status { return 301 https://$host/durum; }
  location /api/     { include /etc/nginx/dash_auth.conf; proxy_pass http://agent:8080/api/; proxy_read_timeout 30s; add_header Cache-Control "no-store"; }
  location / { add_header Cache-Control "public, max-age=300"; try_files $uri /index.html; }
}
