# Pano girişi: basic auth yok. /durum ve /api/ nginx auth_request ile ajanın çerez oturumuna sorulur.
limit_req_zone $binary_remote_addr zone=lumii_login:1m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=lumii_public:1m rate=60r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;
  charset_types text/html text/plain text/css application/javascript application/json;
  gzip on; gzip_types text/html text/css application/javascript application/json image/svg+xml;
  include /etc/nginx/sec_headers.conf;
  limit_req_status 429;

  # Coolify/Traefik arkasında gerçek istemci IP'si. Yalnız özel ağlardan gelen X-Forwarded-For'a
  # güvenilir; böylece hem limit_req hem ajanın IP kilidi gerçek istemciye göre sayar, sahte
  # X-Forwarded-For gönderen dış istemci kendini gizleyemez.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # ---- kimlik kontrolü (iç) ----
  location = /_authcheck {
    internal;
    proxy_pass http://agent:8080/api/auth/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location @giris  { return 302 /giris; }
  location @api401 { default_type application/json; return 401 '{"error":"yetkisiz"}'; }

  # ---- açık yollar ----
  location = /health { default_type text/plain; return 200 "ok\n"; }
  location /assets/  { include /etc/nginx/sec_headers.conf; add_header Cache-Control "public, max-age=86400"; }

  location = /giris {
    include /etc/nginx/sec_headers.conf;
    add_header Cache-Control "no-store";
    default_type text/html;
    alias /usr/share/nginx/html/giris.html;
  }
  location = /giris.html { return 301 /giris; }

  # Giriş uçları auth_request'ten muaf — yoksa giriş yapılamaz.
  location = /api/auth/login {
    limit_req zone=lumii_login burst=10 nodelay;     # dakikada 10 deneme
    include /etc/nginx/sec_headers.conf;
    add_header Cache-Control "no-store";
    proxy_pass http://agent:8080/api/auth/login;
    proxy_read_timeout 30s;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/auth/ {
    include /etc/nginx/sec_headers.conf;
    add_header Cache-Control "no-store";
    proxy_pass http://agent:8080/api/auth/;
    proxy_read_timeout 30s;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Vitrinin tükettiği açık uç — yalnız id/up/ms döner.
  location /api/public/ {
    limit_req zone=lumii_public burst=30 nodelay;    # dakikada 60 istek
    include /etc/nginx/sec_headers.conf;
    add_header Cache-Control "no-store";
    proxy_pass http://agent:8080/api/public/;
    proxy_read_timeout 15s;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # ---- korumalı yollar ----
  location = /durum {
    auth_request /_authcheck;
    error_page 401 403 = @giris;
    include /etc/nginx/sec_headers.conf;
    add_header Cache-Control "no-store";
    default_type text/html;
    alias /usr/share/nginx/html/durum.html;
  }
  location = /durum.html {
    auth_request /_authcheck;
    error_page 401 403 = @giris;
    include /etc/nginx/sec_headers.conf;
    add_header Cache-Control "no-store";
    default_type text/html;
    alias /usr/share/nginx/html/durum.html;
  }
  location = /status { return 301 https://$host/durum; }

  location /api/ {
    auth_request /_authcheck;
    error_page 401 403 = @api401;                    # API'de yönlendirme yok, düz 401 JSON
    include /etc/nginx/sec_headers.conf;
    add_header Cache-Control "no-store";
    proxy_pass http://agent:8080/api/;
    proxy_read_timeout 30s;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location / { include /etc/nginx/sec_headers.conf; add_header Cache-Control "public, max-age=300"; try_files $uri /index.html; }
}
